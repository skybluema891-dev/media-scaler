name: Build desktop releases
on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p 'test_release_*.py'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_automation.py plan
  checks:
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test
  windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare offline engines
        run: |
          python -m pip install -r ai_worker/requirements.txt
          python scripts/prepare_tools.py
          python scripts/build_worker.py
      - name: Install packaging compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/build_windows.ps1 -Version $env:RELEASE_VERSION
      - name: Engine integration tests
        run: python -m unittest discover -s ai_worker -p "test_*.py"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
  macos:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare offline engines
        run: |
          brew install ffmpeg dylibbundler
          python -m pip install -r ai_worker/requirements.txt
          python scripts/prepare_tools.py
          python scripts/build_worker.py
      - name: Install Developer ID certificate and notarization key
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for variable in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Required GitHub secret is missing: $variable"
              exit 1
            fi
          done
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/media-scaler-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(uuidgen)"
          {
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
            echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN"
          } >> "$GITHUB_ENV"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          MACOS_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::error::The certificate does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build app, ZIP and DMG
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          REQUIRE_MACOS_NOTARIZATION: '1'
        run: |
          bash scripts/build_macos.sh "$RELEASE_VERSION"
      - name: Engine integration tests
        run: python -m unittest discover -s ai_worker -p "test_*.py"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "${NOTARY_KEY_PATH:-}" "$RUNNER_TEMP/developer-id.p12"
  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish complete release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_automation.py publish
